<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>JOVAL DINO | YK PRODUCTIONS</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden}body{font-family:Arial,sans-serif;background:#f7f7f2;color:#222}
#game{position:relative;width:100%;height:100%;background:#f7f7f2;overflow:hidden}
canvas{width:100%;height:100%;display:block}
.top{position:absolute;top:14px;left:14px;right:14px;display:flex;justify-content:space-between;align-items:center;pointer-events:none}
.back{pointer-events:auto;text-decoration:none;color:#222;border:2px solid #222;background:#fff;padding:9px 13px;border-radius:9px;font-weight:700;font-size:13px}
.title{font-weight:900;letter-spacing:2px;font-size:15px}.score{font:700 18px monospace}
.help{position:absolute;left:50%;bottom:18px;transform:translateX(-50%);font-size:13px;color:#555;background:#ffffffcc;padding:8px 12px;border-radius:999px;white-space:nowrap}
.over{position:absolute;inset:0;display:none;align-items:center;justify-content:center;background:#f7f7f2dd;text-align:center}.over.show{display:flex}.box{background:white;border:2px solid #222;border-radius:18px;padding:26px 30px;box-shadow:0 8px 0 #222}.box h1{margin:0 0 8px;font-size:30px}.box p{margin:5px 0 18px;color:#555}.box button{border:0;border-radius:10px;background:#222;color:white;padding:12px 20px;font-weight:800;font-size:15px}
</style>
</head>
<body>
<div id="game"><canvas id="c"></canvas><div class="top"><a class="back" href="../">← YK PRODUCTIONS</a><div class="title">JOVAL DINO</div><div class="score" id="score">00000</div></div><div class="help">SPACE / TAP / CLICK = JUMP</div><div class="over" id="over"><div class="box"><h1>GAME OVER</h1><p>Score: <b id="final">0</b></p><button id="restart">PLAY AGAIN</button></div></div></div>
<script>
const cv=document.getElementById('c'),ctx=cv.getContext('2d'),scoreEl=document.getElementById('score'),over=document.getElementById('over'),finalEl=document.getElementById('final'),restart=document.getElementById('restart'),head=new Image();head.src='joval-head.png';
let W,H,D,ground,player,obs,clouds,score,speed,alive,last,spawnTimer;
function resize(){D=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;cv.width=W*D;cv.height=H*D;ctx.setTransform(D,0,0,D,0,0);ground=H*.78;if(player)player.y=ground-player.h}
addEventListener('resize',resize);
function reset(){resize();player={x:Math.min(120,W*.18),y:ground-132,w:108,h:132,vy:0,onGround:true};obs=[];clouds=[];score=0;speed=Math.max(175,Math.min(245,W*.34));alive=true;spawnTimer=.8;over.classList.remove('show');last=performance.now();requestAnimationFrame(loop)}
function jump(){if(!alive){reset();return}if(player.onGround){player.vy=-570;player.onGround=false}}
function addObstacle(){let type=Math.random()<.72?'cactus':'rock';let h=type==='cactus'?35+Math.random()*38:25+Math.random()*24;let w=type==='cactus'?24+Math.random()*18:38+Math.random()*25;obs.push({x:W+40,y:ground-h,w,h,type})}
function hit(a,b){return a.x+12<b.x+b.w-5&&a.x+a.w-12>b.x+5&&a.y+10<b.y+b.h&&a.y+a.h-8>b.y}
function end(){alive=false;finalEl.textContent=Math.floor(score);over.classList.add('show')}
function draw(){ctx.fillStyle='#f7f7f2';ctx.fillRect(0,0,W,H);
// clouds
ctx.fillStyle='#dfe3df';for(let x=80-(score*0.4%220);x<W+250;x+=220){ctx.fillRect(x,95,52,3);ctx.fillRect(x+12,88,30,3)}
// ground
ctx.strokeStyle='#222';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(0,ground+1);ctx.lineTo(W,ground+1);ctx.stroke();
// little ground marks
ctx.strokeStyle='#777';ctx.lineWidth=1;for(let x=20-(score*1.5%80);x<W;x+=80){ctx.beginPath();ctx.moveTo(x,ground+12);ctx.lineTo(x+25,ground+12);ctx.stroke()}
// obstacles
obs.forEach(o=>{ctx.fillStyle='#222';if(o.type==='cactus'){ctx.fillRect(o.x,o.y,o.w,o.h);ctx.fillRect(o.x-9,o.y+16,9,8);ctx.fillRect(o.x+o.w,o.y+28,9,8)}else{ctx.beginPath();ctx.moveTo(o.x,o.y+o.h);ctx.lineTo(o.x+8,o.y+5);ctx.lineTo(o.x+o.w-8,o.y);ctx.lineTo(o.x+o.w,o.y+o.h);ctx.closePath();ctx.fill()}});
// full head sprite
if(head.complete){ctx.drawImage(head,player.x,player.y,player.w,player.h)}else{ctx.fillStyle='#222';ctx.fillRect(player.x,player.y,player.w,player.h)}
}
function loop(now){if(!alive)return;let dt=Math.min((now-last)/1000,.032);last=now;player.vy+=1250*dt;player.y+=player.vy*dt;if(player.y>=ground-player.h){player.y=ground-player.h;player.vy=0;player.onGround=true}
spawnTimer-=dt;if(spawnTimer<=0){addObstacle();spawnTimer=1.35+Math.random()*.85}
speed+=dt*2.2;obs.forEach(o=>o.x-=speed*dt);obs=obs.filter(o=>o.x>-100);score+=dt*10;scoreEl.textContent=String(Math.floor(score)).padStart(5,'0');if(obs.some(o=>hit(player,o)))end();draw();requestAnimationFrame(loop)}
function act(e){if(e)e.preventDefault();jump()}addEventListener('keydown',e=>{if(e.code==='Space'||e.code==='ArrowUp'){e.preventDefault();act(e)}});addEventListener('pointerdown',act);restart.addEventListener('click',e=>{e.stopPropagation();reset()});resize();reset();
</script>
</body></html>
